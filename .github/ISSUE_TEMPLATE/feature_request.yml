name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem** first; a solution can come second. Larger changes are discussed here before any code is written, see
        [GOVERNANCE.md](https://github.com/getplinth/plinth/blob/main/GOVERNANCE.md). Check [docs/roadmap.md](https://github.com/getplinth/plinth/blob/main/docs/roadmap.md) too.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
  - type: checkboxes
    id: help
    attributes:
      label: Would you work on it?
      options:
        - label: I would like to implement this (with guidance)
