name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste secrets** (tokens, passwords, master keys, kubeconfigs, webhook addresses): remove them from logs and configuration first.
        A vulnerability is not a bug report: see [SECURITY.md](https://github.com/getplinth/plinth/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact steps, in the order you did them.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plinth version
      description: "`plinth` logs it at start, or `GET /api/v1/version`. Or the commit if you built it yourself."
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How you run it
      options: [Helm chart on Kubernetes, Container image (other), Built from source, "make demo", "make stack"]
    validations:
      required: true
  - type: textarea
    id: systems
    attributes:
      label: The systems involved
      description: Which drivers and versions (for example Gitea 1.23, Harbor 2.15, Kubernetes 1.31, PostgreSQL 17) and which identity provider, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines or error messages
      description: From Plinth's log, the request page, or the audit log. Remove secrets first.
      render: text
