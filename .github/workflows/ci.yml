name: ci
on: [push, pull_request]
permissions:
  contents: read
# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # What the repository promises about itself: shipped licences, its own scripts, links in the docs.
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest 1.26 patch release: go.mod only names the minimum, and the first patch releases have known
          # vulnerabilities in the standard library (net/http, crypto/tls, crypto/x509 ...).
          go-version: "1.26"
          check-latest: true
      - run: go mod download
      - run: make licenses
      - run: make check-scripts
  # Every commit in a pull request must be signed off (Developer Certificate of Origin, see CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-dco.sh "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run typecheck && npm test && npm run build
      - run: cd web && npm audit --omit=dev
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest 1.26 patch release: go.mod only names the minimum, and the first patch releases have known
          # vulnerabilities in the standard library (net/http, crypto/tls, crypto/x509 ...).
          go-version: "1.26"
          check-latest: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: make helm-test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest 1.26 patch release: go.mod only names the minimum, and the first patch releases have known
          # vulnerabilities in the standard library (net/http, crypto/tls, crypto/x509 ...).
          go-version: "1.26"
          check-latest: true
      - run: make lint
      - run: go test -race ./...
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest 1.26 patch release: go.mod only names the minimum, and the first patch releases have known
          # vulnerabilities in the standard library (net/http, crypto/tls, crypto/x509 ...).
          go-version: "1.26"
          check-latest: true
      # Uses kind when present on the runner image; the script falls back to k3d.
      - run: make itest
