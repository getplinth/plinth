name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # Mondays: new advisories appear without any change here
permissions:
  contents: read
jobs:
  # Known vulnerabilities in the Go code that Plinth actually calls (not just in modules it lists).
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest 1.26 patch release: go.mod only names the minimum, and the first patch releases have known
          # vulnerabilities in the standard library (net/http, crypto/tls, crypto/x509 ...).
          go-version: "1.26"
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...
  # New dependencies in a pull request: known vulnerabilities and licences. Needs a public repository
  # (or GitHub Advanced Security), so it is skipped while the repository is private.
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-3.0-only
