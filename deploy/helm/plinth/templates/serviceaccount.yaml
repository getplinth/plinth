{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plinth.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plinth.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Plinth manages other systems with the credentials stored in its integrations.
# It never calls this cluster's API with its own identity, so no token is mounted.
automountServiceAccountToken: false
{{- end }}
