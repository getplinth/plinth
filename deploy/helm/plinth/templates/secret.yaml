{{- /* Only created for values given inline. Prefer database.existingSecret and masterKey.existingSecret. */ -}}
{{- if or .Values.database.url .Values.masterKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plinth.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plinth.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if .Values.masterKey.value }}
  master-key: {{ .Values.masterKey.value | quote }}
  {{- end }}
{{- end }}
