{{- /* The first administrator's starting password, generated once and kept across upgrades
       (lookup finds the existing Secret). It is only used while no password account exists:
       the person must choose a new password at first sign-in, so this one is stale afterwards. */ -}}
{{- if and .Values.admin.create (not .Values.admin.existingSecret) }}
{{- $name := printf "%s-admin" (include "plinth.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := randAlphaNum 20 }}
{{- if contains "admin" (lower $pw) }}{{ $pw = randAlphaNum 20 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plinth.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ if and $existing $existing.data (index $existing.data "password") }}{{ index $existing.data "password" }}{{ else }}{{ $pw | b64enc }}{{ end }}
{{- end }}
